<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0d10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Nido">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Nido</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..600&family=Geist:wght@400..700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="setup" class="setup" hidden></div>

  <div id="app" class="app" hidden>
    <nav class="rail" id="rail" aria-label="Navigation principale"></nav>
    <main>
      <div class="page">
        <header class="topbar">
          <button class="back" id="back" data-act="back" hidden><i class="mdi mdi-chevron-left" aria-hidden="true"></i><span>Plus</span></button>
          <h1 id="title"></h1>
          <span class="pill" id="status" role="status"><span class="dot"></span><span class="lbl"></span></span>
          <button class="icon-btn" data-act="settings" aria-label="Réglages"><i class="mdi mdi-tune-variant" aria-hidden="true"></i></button>
        </header>
        <div id="view" class="grid"></div>
      </div>
    </main>
    <nav class="tabbar" id="tabbar" aria-label="Onglets"></nav>
  </div>

  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" hidden>
    <div class="grabber"></div>
    <div id="sheetBody"></div>
  </div>

  <dialog id="dlg"></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="ha.js"></script>
  <script src="discovery.js"></script>
  <script src="app.js"></script>
</body>
</html>
